# ====================================================================================
# Thermia / Danfoss DHP-AQ -- ESP gateway replacement (Thermia Online gateway, 0x0F).
#
# The ESP sits on the RS485 bus between the heat pump and the gateway position and IS the
# gateway: it answers the heat pump's handshake, acks its writes, serves the mailbox
# (1800-1805), and can change settings via the mailbox re-read flags (two pulses per write).
# See HANDOFF.md for the full picture and README-build-and-run.md for operation.
#
# Safety: the ESP starts DISARMED at every boot. With auto_takeover it self-arms after
# auto_listen_ms if no real gateway is heard, then seeds values with a full resync. It
# auto-disarms within ~50 ms if a real gateway is ever heard. GPIO21 (driver-enable) is held
# low except during an armed transmit. Recovery: plug the real gateway back in and reboot the
# heat pump.
#
# Values: nothing is stored across an ESP reboot. Every entity is "unknown" until the heat
# pump genuinely sends that register. Live values (2000-2239) arrive within ~21 s; settings
# (1000-1798) arrive at a heat-pump boot or after a resync (automatic at takeover).
#
# Live I/O: the heat pump's ~1 s FC23 exchanges with its other bus devices (0x02, 0x04) are
# decoded too, for the pump / flow / valve / test-mode entities (stale after 5 s, see
# "Live IO Fresh"). Alarm bits 2143-2147 are decoded -> "Active Alarm Bits".
#
# Register definitions: thermia-register-definitions.csv. The CSV "modifier" column is
# Thermia Online UI metadata only and is not used in any value calculation; scaling comes
# from the CSV "step" column. Groups not in the CSV: see NOTE-missing-register-groups.md.
# ====================================================================================
substitutions:
  baud: "9600"       # bus settings: 9600 8E1
  parity: "EVEN"
  stop_bits: "1"

esphome:
  name: danfoss-dhp-aq
  # Sub-devices: group every entity under one node so Home Assistant shows collapsible
  # groups. device_id on each entity below selects its group. Added 18 Oct 2026.
  devices:
    - id: dev_heating
      name: "Heating & Curve"
    - id: dev_heatpump
      name: "Heat Pump Control"
    - id: dev_hotwater
      name: "Hot Water"
    - id: dev_cooling
      name: "Cooling"
    - id: dev_immersion
      name: "Immersion Heater"
    - id: dev_calibration
      name: "Sensor Calibration"
    - id: dev_temps
      name: "Temperatures"
    - id: dev_runtime
      name: "Runtime Counters"
    - id: dev_defrost
      name: "Defrosting"
    - id: dev_diag
      name: "Operational Diagnostics"
    - id: dev_opmode
      name: "Operation Mode & Status"
    - id: dev_odu
      name: "Outdoor Unit (ODU)"
    - id: dev_liveio
      name: "Pumps & Valves"   # live I/O frames; decodes need more testing (see HANDOFF §6)
    - id: dev_alarms
      name: "Alarms"
    - id: dev_shadow
      name: "Gateway Shadow & Handshake"
    - id: dev_mailbox
      name: "Mailbox & Raw Registers"   # all diagnostic: mailbox, raw bit-words, numeric enum copies, unknowns

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Port 80: the thermia_sniffer component auto-loads web_server_base and serves ONLY
# GET /registers.json (raw registers + live I/O, read-only). See README-register-logging.md.
api:
  encryption:
    key: !secret thermia_api_encryption_key

# OTA uploads are encrypted with the api: key above (a bare "encryption:" reuses it).
# Needs ESPHome 2026.9+ on the device: if the running firmware is older, flash once with
# "password: !secret thermia_ota_password" in place of encryption:, then switch.
ota:
  - platform: esphome
    encryption:

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: components

# Main RS485 port (Waveshare ESP32-S3-RS485-CAN screw terminals).
uart:
  - id: hp_bus
    rx_pin: GPIO18
    tx_pin: GPIO17        # Transmits only while ARMED: GPIO21 (driver-enable) is held low
                          # otherwise, and nothing is sent while a real gateway is replying.
    baud_rate: ${baud}
    data_bits: 8
    parity: ${parity}
    stop_bits: ${stop_bits}
    rx_buffer_size: 1024

# Writable settings. Each control WRITES to the heat pump when takeover is ARMED: the value
# is clamped to the register's CSV range in firmware, only that register changes in the
# store (the rest of its block stays exactly as the heat pump last pushed it), and the
# block's mailbox flag is raised twice (pulse, gap, pulse), matching the real gateway.
# Refused if not armed, or if the register has not been seen this session. A negative-range
# register must use set_writable_reg_signed() with the encoding seen on the bus for it.
#   1801=1 -> block 1000-1012 (heating curve)    1801=4 -> block 1040-1060 (hot water)
#   1801=8 -> block 1070-1084 (heat pump control)  -- all 16 1801 bits confirmed by sweep 20 Oct
#   1800=1 -> block 1350-1369 (operation mode)     -- upper settings word, bit 0
number:
  # Every box shows the real current value the ESP holds (blank until the register has been
  # seen this session), so 'optimistic' must NOT be set (ESPHome forbids it with 'lambda').

  # --- Hot water (block 1040-1060, delivered by mailbox flag 1801=4) ---
  - platform: template
    name: "Hot Water Start Temp (write)"
    id: hw_start_temp
    device_id: dev_hotwater
    unit_of_measurement: "°C"
    min_value: 30
    max_value: 55
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1053); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1053, x, 30, 55, 4, \"hw_start\");"

  # --- Heating curve (block 1000-1012, delivered by mailbox flag 1801=1) ---
  - platform: template
    name: "Heating Curve (write)"
    id: w_heat_curve
    device_id: dev_heating
    min_value: 22
    max_value: 56
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1000); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1000, x, 22, 56, 1, \"heat_curve\");"
  - platform: template
    name: "Heating Curve Min (write)"
    id: w_heat_curve_min
    device_id: dev_heating
    min_value: 10
    max_value: 50
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1001); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1001, x, 10, 50, 1, \"heat_curve_min\");"
  - platform: template
    name: "Heating Curve Max (write)"
    id: w_heat_curve_max
    device_id: dev_heating
    min_value: 40
    max_value: 85
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1002); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1002, x, 40, 85, 1, \"heat_curve_max\");"
  - platform: template
    name: "Heat Stop (write)"
    id: w_heat_stop
    device_id: dev_heating
    min_value: 0
    max_value: 40
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1006); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1006, x, 0, 40, 1, \"heat_stop\");"
  - platform: template
    name: "Room Factor (write)"
    id: w_room_factor
    device_id: dev_heating
    min_value: 0
    max_value: 4
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1008); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1008, x, 0, 4, 1, \"room_factor\");"
  # Room setpoint (reg 1012, last register of the 1000-1012 block, 1801=1 - the flag the real
  # gateway raised for online room-setpoint changes). NOT in the CSV, so there is no official
  # range: 10-30 C is a conservative assumption. Extra guard: the write is refused unless the
  # CURRENT value is already within 10-30, so a different bus scaling (e.g. tenths) can never
  # be written to by mistake. Whole degrees, as the read-back sensor shows.
  - platform: template
    name: "Room Setpoint (write)"
    id: w_room_setpoint
    device_id: dev_heating
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 30
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1012); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: |-
          float cur = id(hp_sniffer)->get_reg_value(1012);
          if (isnan(cur) || cur < 10 || cur > 30) {
            ESP_LOGW("thermia_sniffer", "room setpoint (reg 1012) write refused: current value %.0f outside 10-30, scaling unconfirmed", cur);
            return;
          }
          id(hp_sniffer)->set_writable_reg(1012, x, 10, 30, 1, "room_setpoint");

  # --- Hot water times (block 1040-1060, delivered by mailbox flag 1801=4, same block as
  # 1053 which is already proven). ---
  - platform: template
    name: "Hot Water Time (write)"
    id: w_hw_time
    device_id: dev_hotwater
    unit_of_measurement: "min"
    min_value: 5
    max_value: 40
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1054); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1054, x, 5, 40, 4, \"hw_time\");"
  - platform: template
    name: "Hot Water Top Heating Time (write)"
    id: w_hw_top_time
    device_id: dev_hotwater
    unit_of_measurement: "h"
    min_value: 0
    max_value: 10
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1056); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1056, x, 0, 10, 4, \"hw_top_time\");"
  # Legionella / periodic top-heating interval (reg 1055), same 1040-1060 block, 1801=4.
  # 0 = periodic top heating off.
  - platform: template
    name: "Hot Water Top Heating Interval (write)"
    id: w_hw_toph_inter
    device_id: dev_hotwater
    unit_of_measurement: "days"
    min_value: 0
    max_value: 90
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1055); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1055, x, 0, 90, 4, \"hw_toph_inter\");"

  # --- Heat pump control (block 1070-1084, delivered by mailbox flag 1801=8, confirmed by the
  # sweep 20 Oct 2026). 1070 (integral A1) is not here: read-only by decision. ---
  - platform: template
    name: "Heating Time (write)"
    id: w_heating_time
    device_id: dev_heatpump
    min_value: 5
    max_value: 40
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1072); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1072, x, 5, 40, 8, \"heating_time\");"
  - platform: template
    name: "Heating Hysteresis (write)"
    id: w_heating_hyst
    device_id: dev_heatpump
    min_value: 1
    max_value: 15
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1073); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1073, x, 1, 15, 8, \"heating_hyst\");"
  - platform: template
    name: "Heating Max Return (write)"
    id: w_heating_max_return
    device_id: dev_heatpump
    unit_of_measurement: "°C"
    min_value: 30
    max_value: 70
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1074); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1074, x, 30, 70, 8, \"heating_max_return\");"
  - platform: template
    name: "Heating Start Interval (write)"
    id: w_heating_start_inter
    device_id: dev_heatpump
    min_value: 10
    max_value: 30
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1075); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg(1075, x, 10, 30, 8, \"heating_start_inter\");"
  # 1077 outdoor stop is negative (-20..-1). The bus sends it in two's complement (-20 is seen
  # as 0xFFEC), so it uses the signed path with that encoding. Display value = bus value.
  - platform: template
    name: "Heating Outdoor Stop (write)"
    id: w_heating_outd_stop
    device_id: dev_heatpump
    unit_of_measurement: "°C"
    min_value: -20
    max_value: -1
    step: 1
    mode: box
    lambda: "float v = id(hp_sniffer)->get_reg_value(1077); if (isnan(v)) return {}; return v;"
    update_interval: 5s
    set_action:
      - lambda: "id(hp_sniffer)->set_writable_reg_signed(1077, x, -20, -1, 8, \"heating_outd_stop\", thermia::Encoding::TWOS_COMPLEMENT);"

# Enumeration settings as selects (options are the CSV labels). Same write path as number:.
select:
  # Hot water on/off (reg 1059, block 1040-1060, 1801=4). Shows the real current value once
  # seen; blank until then. An unexpected bus value (not 0/1) also shows blank - see the
  # REG_HOT_WATER_STATUS_TEXT sensor for the raw number.
  - platform: template
    name: "Hot Water Status (write)"
    id: w_hw_status
    device_id: dev_hotwater
    options:
      - "STATUS_OFF"
      - "STATUS_ON"
    lambda: |-
      float v = id(hp_sniffer)->get_reg_value(1059);
      if (isnan(v)) return {};
      if (v == 0) return std::string("STATUS_OFF");
      if (v == 1) return std::string("STATUS_ON");
      return {};
    update_interval: 5s
    set_action:
      - lambda: |-
          const int v = (x == "STATUS_ON") ? 1 : 0;
          id(hp_sniffer)->set_writable_reg(1059, v, 0, 1, 4, "hw_status");
  # Operation mode (reg 1363, block 1350-1369, delivered by mailbox WORD 1800 = 1 - the upper
  # settings word, observed on the bus with the real gateway). Options are the CSV labels, in
  # register order (index = bus value). Thermia Online asks for confirmation before changing
  # this (CSV ui_confirm_on_change); ESPHome cannot, so add confirmation on the HA dashboard
  # card if wanted. OFF stops the heat pump entirely.
  - platform: template
    name: "Operation Mode (write)"
    id: w_operation_mode
    device_id: dev_opmode
    options:
      - "OPERATION_MODE_OFF"
      - "OPERATION_MODE_AUTO"
      - "OPERATION_MODE_COMPRESSOR"
      - "OPERATION_MODE_AUXILIARY"
      - "OPERATION_MODE_HOT_WATER"
    lambda: |-
      static const char *const L[] = {"OPERATION_MODE_OFF", "OPERATION_MODE_AUTO", "OPERATION_MODE_COMPRESSOR",
                                      "OPERATION_MODE_AUXILIARY", "OPERATION_MODE_HOT_WATER"};
      float v = id(hp_sniffer)->get_reg_value(1363);
      if (isnan(v) || v < 0 || v > 4) return {};
      return std::string(L[(int) v]);
    update_interval: 5s
    set_action:
      - lambda: |-
          static const char *const L[] = {"OPERATION_MODE_OFF", "OPERATION_MODE_AUTO", "OPERATION_MODE_COMPRESSOR",
                                          "OPERATION_MODE_AUXILIARY", "OPERATION_MODE_HOT_WATER"};
          for (int i = 0; i < 5; i++) {
            if (x == L[i]) { id(hp_sniffer)->set_writable_reg_upper(1363, i, 0, 4, 1, "operation_mode"); return; }
          }

# Takeover arming control + driver-enable ownership.
# GPIO21 (SP3485 driver-enable, DE+/RE tied) is now the component's flow_control_pin: held
# LOW (receive) at boot, driven high only for the few hundred microseconds of an armed,
# bus-idle transmit. It is no longer an HA switch, so it cannot be toggled by hand.
#
# "Takeover Arm" reflects the real armed state (auto or manual) and is a manual override.
# OFF disarms and keeps the ESP disarmed UNTIL THE NEXT REBOOT (even with auto_takeover), so
# the ESP can be quietened without unplugging it; a reboot returns to auto behaviour. ON asks
# the component to arm, which it refuses unless takeover_capable is set, a flow_control_pin
# is configured, and no real gateway is replying. Any fault (e.g. hearing a real gateway
# while armed) auto-disarms. Always OFF at boot (no restore).
switch:
  - platform: template
    name: "Takeover Arm (answer as gateway)"
    id: takeover_arm
    device_id: dev_shadow
    restore_mode: ALWAYS_OFF
    optimistic: false
    turn_on_action:
      - lambda: "id(hp_sniffer)->request_takeover(true);"
      - delay: 200ms
      - lambda: "id(takeover_arm).publish_state(id(hp_sniffer)->takeover_armed());"
    turn_off_action:
      - lambda: "id(hp_sniffer)->request_takeover(false);"
      - lambda: "id(takeover_arm).publish_state(false);"

# Keep the Takeover Arm toggle in step with the real armed state (switch or auto-takeover).
interval:
  - interval: 5s
    then:
      - lambda: "id(takeover_arm).publish_state(id(hp_sniffer)->takeover_armed());"

thermia_sniffer:
  id: hp_sniffer
  uart_id: hp_bus
  slave_address: 15      # gateway (0x0F)
  log_changes: true      # every register change to the ESPHome log (DEBUG); handy for decoding unknowns
  takeover_capable: true          # allow arming (always disarmed at boot)
  flow_control_pin: GPIO21        # RS485 driver-enable; low=receive, high=transmit (armed only)
  # Auto-takeover (permanent replacement): the ESP self-arms after listening auto_listen_ms
  # for a real gateway and hearing none, then seeds its values with one resync as soon as it
  # sees the heat pump addressing it. The auto-disarm-on-real-gateway override
  # stays active, so replugging the real gateway always makes the ESP step aside within ~50 ms.
  #
  # auto_listen_ms is a SAFETY window: if the ESP reboots on its own into a running system
  # that still has a real gateway, it hears the gateway's replies (polled every ~4.2 s) within
  # this window and refuses to arm. It does NOT need to be long - a few seconds covers a steady
  # running system. (At a shared cold boot neither a long nor a short window catches a gateway,
  # which only appears ~30 s in, so both rely on the continuous auto-disarm anyway.) Short =
  # "take over at load": arm within a few seconds, resync as soon as the HP polls us, values
  # populated. Set it back up to 20 s if you ever run with the real gateway still on the bus.
  auto_takeover: true
  auto_listen_ms: 8s
  registers:
    # ==============================================================================
    # REGISTERS FROM thermia-register-definitions.csv, in CSV order.
    # These are the read-back sensors (what the heat pump last sent). Write controls live in
    # number:/select: above. The comment on each line gives its write status. Enumerations
    # also get a <NAME>_TEXT text sensor further down showing the CSV label, e.g. "STATUS_ON (1)".
    # CSV-only registers 7002/7003 are cloud-side (never on the bus) and are not listed.
    # ==============================================================================
    # 1000 HEATING_CURVE | Slider 22..56 step 1 | WRITABLE (1801=1, see number: above)
    - register: 1000
      name: "REG_HEATING_HEAT_CURVE"
      device_id: dev_heating
      accuracy_decimals: 0
    # 1001 HEATING_CURVE | Slider 10..50 step 1 | WRITABLE (1801=1, see number: above)
    - register: 1001
      name: "REG_HEATING_HEAT_CURVE_MIN"
      device_id: dev_heating
      unit_of_measurement: "°C"
      device_class: temperature
      accuracy_decimals: 0
    # 1002 HEATING_CURVE | Slider 40..85 step 1 | WRITABLE (1801=1, see number: above)
    - register: 1002
      name: "REG_HEATING_HEAT_CURVE_MAX"
      device_id: dev_heating
      unit_of_measurement: "°C"
      device_class: temperature
      accuracy_decimals: 0
    # 1003 HEATING_CURVE | Slider -5..5 step 1 | writable later if wanted: signed write path exists, encoding to confirm with one test write
    - register: 1003
      name: "REG_HEATING_CURVE_PLUS5"
      device_id: dev_heating
      accuracy_decimals: 0
    # 1004 HEATING_CURVE | Slider -5..5 step 1 | writable later if wanted: signed write path exists, encoding to confirm with one test write
    - register: 1004
      name: "REG_HEATING_CURVE_0"
      device_id: dev_heating
      unit_of_measurement: "°C"
      device_class: temperature
      accuracy_decimals: 0
    # 1005 HEATING_CURVE | Slider -5..5 step 1 | writable later if wanted: signed write path exists, encoding to confirm with one test write
    - register: 1005
      name: "REG_HEATING_CURVE_MINUS5"
      device_id: dev_heating
      unit_of_measurement: "°C"
      device_class: temperature
      accuracy_decimals: 0
    # 1006 HEATING_CURVE | Slider 0..40 step 1 | WRITABLE (1801=1, see number: above)
    - register: 1006
      name: "REG_HEATING_HEAT_STOP"
      device_id: dev_heating
      unit_of_measurement: "°C"
      device_class: temperature
      accuracy_decimals: 0
    # 1008 HEATING_CURVE | Slider 0..4 step 1 | WRITABLE (1801=1, see number: above)
    - register: 1008
      name: "REG_HEATING_ROOM_FACTOR"
      device_id: dev_heating
      accuracy_decimals: 0
    # 1053 HOT_WATER | Slider 30..55 step 1 | WRITABLE (1801=4, see number: above)
    - register: 1053
      name: "REG_SER_HOT_WATER_START"
      device_id: dev_hotwater
      unit_of_measurement: "°C"
      device_class: temperature
      accuracy_decimals: 0
    # 1054 HOT_WATER | Slider 5..40 step 1 | WRITABLE (1801=4, see number: above)
    - register: 1054
      name: "REG_SER_HOT_WATER_TIME"
      device_id: dev_hotwater
      unit_of_measurement: "min"
      accuracy_decimals: 0
    # 1055 HOT_WATER | Slider 0..90 step 1 | WRITABLE (1801=4, see number: above)
    - register: 1055
      name: "REG_SER_HOT_WATER_TOPH_INTER"
      device_id: dev_hotwater
      unit_of_measurement: "days"
      accuracy_decimals: 0
      signed: false
    # 1056 HOT_WATER | Slider 0..10 step 1 | WRITABLE (1801=4, see number: above)
    - register: 1056
      name: "REG_HOT_WATER_TOP_HEATING_TIME"
      device_id: dev_hotwater
      unit_of_measurement: "h"
      accuracy_decimals: 0
    # 1059 HOT_WATER | Enumeration [0=STATUS_OFF; 1=STATUS_ON] | WRITABLE (1801=4, see select: above)
    - register: 1059
      name: "REG_HOT_WATER_STATUS"
      device_id: dev_mailbox
      state_class: measurement
      accuracy_decimals: 0
      signed: false
      entity_category: diagnostic
    # 1061 HOT_WATER | Slider 31..65 step 1 | NEVER ON THE BUS: 1061 sits in the 0425-042D gap of every block, so it stays unknown
    - register: 1061
      name: "REG_HOT_WATER_STATUS_STOP"
      device_id: dev_hotwater
      unit_of_measurement: "°C"
      device_class: temperature
      accuracy_decimals: 0
    # 1070 HEAT_PUMP | Slider -250..-5 step 1 | READ-ONLY by decision (change on the HP); bus stores magnitude
    - register: 1070
      name: "REG_SER_HEATING_INTEGRALA1"
      device_id: dev_heatpump
      unit_of_measurement: "°min"
      accuracy_decimals: 0
      filters: [{multiply: -1}]   # bus holds the magnitude (60 on bus = -60 degree-minutes)
    # 1072 HEAT_PUMP | Slider 5..40 step 1 | WRITABLE (1801=8, see number: above)
