    # 2013: gateway copy (every ~21 s) of the HP's command to dev2 A80C. CM930 calls it
    # oper_data_port_b_hub_card (HUB card relay bits) and names bit 2 (ext aux heater
    # pot-free), bit 3 (ext aux heater) and bit 7 (immersion heater 1, 3 kW).
    # Found 16 Oct 2026: bit 0 = change-over valve (1 = hot water, 0 = heating),
    # bit 5 = circulating pump relay, bit 6 = set in every capture with the system on,
    # clear with the system off (14:40 capture) -- possibly a system enable output.
    # The binary sensors below decode the live A80C frame instead of this copy.
    - register: 2013
      name: "Reg 2013 (gateway copy of dev2 A80C)"
      device_id: dev_mailbox
      state_class: measurement
      accuracy_decimals: 0
      signed: false
