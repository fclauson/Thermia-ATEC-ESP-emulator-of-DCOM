      accuracy_decimals: 0
      signed: false
    - register: 1081
      name: "Post Box 1081 (unconfirmed)"
      device_id: dev_mailbox
      accuracy_decimals: 0
      signed: false
    # 2136: suspected post box (user, 9 Oct 2026). Not in CM930 or the definitions file.
    # Seen 16->37 and 24->45 (+21 both times). See claude/register-notes.md.
    - register: 2136
      name: "Post Box 2136 (unconfirmed)"
      device_id: dev_mailbox
      state_class: measurement
      accuracy_decimals: 0
      signed: false
      entity_category: diagnostic
    # 1012 room setpoint: not in the CSV (found on the bus). WRITABLE (1801=1, see number: above),
    # range 10-30 C assumed.
    - register: 1012
      name: "Room Stat Setpoint 1012"
      device_id: dev_heating
      unit_of_measurement: "°C"
      device_class: temperature
      accuracy_decimals: 0
    - register: 2078
      name: "Reg 2078 (HP cmd to dev6 AFE0)"
      device_id: dev_mailbox
      accuracy_decimals: 0
      entity_category: diagnostic
      signed: false
text_sensor:
  - platform: template
    name: "REG_HOT_WATER_STATUS_TEXT"
    device_id: dev_hotwater
    update_interval: 5s
    lambda: |-
      if (!id(hp_sniffer)->has_register(1059)) return {};
      uint16_t v = id(hp_sniffer)->get_register(1059);
      static const char *const L[] = {"STATUS_OFF", "STATUS_ON"};
      if (v < sizeof(L) / sizeof(L[0])) return std::string(L[v]) + " (" + to_string((int) v) + ")";
      return "Unknown (" + to_string((int) v) + ")";
  - platform: template
    name: "REG_ACTIVATE_COOLING_TEXT"
    device_id: dev_cooling
    update_interval: 5s
    lambda: |-
      if (!id(hp_sniffer)->has_register(1090)) return {};
      uint16_t v = id(hp_sniffer)->get_register(1090);
      static const char *const L[] = {"STATUS_OFF", "STATUS_ON"};
      if (v < sizeof(L) / sizeof(L[0])) return std::string(L[v]) + " (" + to_string((int) v) + ")";
      return "Unknown (" + to_string((int) v) + ")";
  - platform: template
    name: "REG_SER_AUX_HEAT_MAX_STEP_TEXT"
    device_id: dev_immersion
    update_interval: 5s
    lambda: |-
      if (!id(hp_sniffer)->has_register(1110)) return {};
      uint16_t v = id(hp_sniffer)->get_register(1110);
      static const char *const L[] = {"STATUS_OFF", "STATUS_STEP1", "STATUS_STEP2", "STATUS_STEP3", "STATUS_STEP4", "STATUS_STEP5", "STATUS_STEP6", "STATUS_STEP7", "STATUS_STEP8"};
      if (v < sizeof(L) / sizeof(L[0])) return std::string(L[v]) + " (" + to_string((int) v) + ")";
      return "Unknown (" + to_string((int) v) + ")";
  - platform: template
    id: hp_mode_text
    name: "REG_OPERATIONMODE_TEXT"
    device_id: dev_opmode
    update_interval: 5s
    lambda: |-
      if (!id(hp_sniffer)->has_register(1363)) return {};
      uint16_t v = id(hp_sniffer)->get_register(1363);
      static const char *const L[] = {"OPERATION_MODE_OFF", "OPERATION_MODE_AUTO", "OPERATION_MODE_COMPRESSOR", "OPERATION_MODE_AUXILIARY", "OPERATION_MODE_HOT_WATER"};
      if (v < sizeof(L) / sizeof(L[0])) return std::string(L[v]) + " (" + to_string((int) v) + ")";
      return "Unknown (" + to_string((int) v) + ")";
  - platform: template
    name: "REG_LINK_INTEGRATION_TEXT"
    device_id: dev_opmode
    update_interval: 5s
    lambda: |-
      if (!id(hp_sniffer)->has_register(1369)) return {};
      uint16_t v = id(hp_sniffer)->get_register(1369);
      static const char *const L[] = {"REG_LINK_STATUS_LIGHT", "REG_LINK_STATUS_SYSTEM"};
      if (v < sizeof(L) / sizeof(L[0])) return std::string(L[v]) + " (" + to_string((int) v) + ")";
      return "Unknown (" + to_string((int) v) + ")";
  # Handshake check: the CM930 answer is computed for every heat-pump challenge and compared
  # with a real gateway's reply. Only meaningful with a real gateway connected; with the ESP
  # as sole gateway it normally reads "none seen since ESP boot".
  - platform: template
    name: "Handshake Check"
    device_id: dev_shadow
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(hp_sniffer)->handshake_status();
  # Gateway shadow: the reply the ESP would send vs a real gateway's, byte-for-byte. Only
  # active with a real gateway connected ("nothing checked yet" otherwise). "MISMATCH ..." =
  # a model bug (log tag thermia_audit, SHADOW lines).
  - platform: template
    name: "Gateway Shadow Check"
    device_id: dev_shadow
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      return id(hp_sniffer)->shadow_status();
  # Armed / disarmed and why. Changes only on a state change (no counters in the text).
  - platform: template
    name: "Takeover Status"
    device_id: dev_shadow
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(hp_sniffer)->takeover_status();
  # Outcome of the last write or resync request.
  - platform: template
    name: "Last Write Result"
    device_id: dev_shadow
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(hp_sniffer)->last_write_result();
  # Every set bit of 2143..2147 with its firmware name. Air-to-water name first; where the
  # ground-source profile names the bit differently both are shown ("a/b"); "brine:" =
  # defined only in the ground-source profile. Raw bits: firmware conditions not applied.
  # Unknown until the heat pump has written the alarm block since the ESP booted.
  - platform: template
    name: "Active Alarm Bits"
    device_id: dev_alarms
    update_interval: 10s
    lambda: |-
      if (!id(hp_sniffer)->alarms_known()) return {};
      return id(hp_sniffer)->active_alarms();
  # Registers seen on the bus with no entry in the registers: list above. INTERNAL (not sent
  # to Home Assistant) so it does not fill the activity log; use the "Dump Unmapped Registers"
  # button for the full list with values. Remove 'internal' to show it in HA again.
  - platform: template
    name: "Unmapped Registers Seen"
    internal: true
    update_interval: 30s
    lambda: |-
      return id(hp_sniffer)->unmapped_summary();
  # 2149 Operational Status Register as readable text: every active bit (0-7) listed,
  # "Idle" when the register is 0, unknown until the register has been seen once.
  - platform: template
    name: "Operational Status"
    device_id: dev_opmode
    update_interval: 5s
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      uint16_t v = id(hp_sniffer)->get_register(2149);
      static const char *const NAMES[8] = {
          "Building Space Heating", "Domestic Hot Water", "Hot Water Top-Up / Antilegionella",
          "Pool Heating", "Building Defrost", "Hot Water Defrost", "Outdoor Low Temp Stop",
          "Cooling"};
      std::string out;
      for (int b = 0; b < 8; b++) {
        if (v & (1u << b)) {
          if (!out.empty()) out += ", ";
          out += NAMES[b];
        }
      }
      if (v & 0xFF00u) {
        if (!out.empty()) out += ", ";
        out += "other bits 0x" + str_snprintf("%04X", 6, (unsigned) (v & 0xFF00u));
      }
      if (out.empty()) out = "Idle";
      return out;

  # Friendly labels for the live flow and valve states (same bits as the binary sensors).
  - platform: template
    name: "Flow Status"
    device_id: dev_liveio
    update_interval: 2s
    lambda: |-
      if (!id(hp_sniffer)->has_reply(4, 0xABEA)) return {};
      return std::string((id(hp_sniffer)->get_reply(4, 0xABEA) & (1u << 4)) == 0 ? "Flow" : "No flow");
  - platform: template
    name: "Change-over Valve Position"
    device_id: dev_liveio
    update_interval: 2s
    lambda: |-
      if (!id(hp_sniffer)->has_cmd(2, 0xA80C)) return {};
      return std::string((id(hp_sniffer)->get_cmd(2, 0xA80C) & (1u << 0)) != 0 ? "Hot water" : "Heating");

# Both buttons write to the ESPHome log (tag thermia_dump). Each keeps its own memory.
button:
  # Armed only: serve the resync mailbox pattern so the heat pump re-pushes its settings
  # table, 1000-1777 (see full-resync-trigger.md). Auto-takeover does this once by itself;
  # press it to refresh. Holds for 35 s, then the mailbox returns to quiescent.
  - platform: template
    name: "Request Full Resync"
    device_id: dev_shadow
    on_press:
      - lambda: "id(hp_sniffer)->request_full_resync();"
  # Every register whose value differs from what it was at the previous press
  # (reg: old->new). The first press after boot only records a baseline.
  - platform: template
    name: "Log Changed Registers Since Last Logged"
    device_id: dev_shadow
    entity_category: diagnostic
    on_press:
      - lambda: id(hp_sniffer)->log_changed_since_last();
  # Registers with no sensor in this YAML that have appeared since the previous press
  # (first press: since boot), with their current value -- candidates to add above.
  - platform: template
    name: "Dump Unmapped Registers"
    device_id: dev_shadow
    entity_category: diagnostic
    on_press:
      - lambda: id(hp_sniffer)->dump_unmapped_new();

# Live I/O numeric values (see the LIVE I/O block under binary_sensor:). NAN = unknown
# when no fresh frame has arrived for 5 s.
sensor:
  # Handshakes whose real gateway reply equalled the computed answer, since ESP boot.
  - platform: template
    name: "Handshake Matches"
    device_id: dev_shadow
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      return (float) id(hp_sniffer)->handshake_matches();
  - platform: template
    name: "Handshake Mismatches"
    device_id: dev_shadow
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      return (float) id(hp_sniffer)->handshake_mismatches();
  # Gateway-shadow model bugs: FC16 ack or FC03 read that our model got wrong. Should stay
  # 0. Cloud changes and mailbox events are NOT counted here (they are expected).
  - platform: template
    name: "Gateway Shadow Mismatches"
    device_id: dev_shadow
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      return (float) (id(hp_sniffer)->shadow_ack_mismatches());
  # Frames the ESP has transmitted as the gateway (0 unless armed).
  - platform: template
    name: "Takeover TX Frames"
    device_id: dev_shadow
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 5s
    lambda: |-
      return (float) id(hp_sniffer)->tx_frames_sent();
  # Mailbox serving health: requested vs served vs dropped (bus busy). A high dropped count
  # means mailbox replies (and thus flags/writes) often don't reach the HP.
  # Seconds since the heat pump last wrote any register to us. Normally resets every ~1-21 s;
  # if it climbs without bound the heat pump has stopped talking to the gateway (investigate).
  - platform: template
    name: "Seconds Since HP Update"
    device_id: dev_shadow
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: "return id(hp_sniffer)->seconds_since_hp_update();"
  - platform: template
    name: "Mailbox Reads Served"
    device_id: dev_shadow
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 5s
    lambda: "return (float) id(hp_sniffer)->mailbox_served();"
  - platform: template
    name: "Mailbox Reads Dropped (bus busy)"
    device_id: dev_shadow
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 5s
    lambda: "return (float) id(hp_sniffer)->mailbox_dropped_idle();"
  # dev2 A80F: circulating pump speed demand in %. Confirmed in test mode: manual ramp
  # 30..100 in steps of 10 and back down. Normal: 10 idle, 40 pumping, 5 just after stop.
  - platform: template
    name: "Circulating Pump Speed"
    device_id: dev_liveio
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (!id(hp_sniffer)->has_cmd(2, 0xA80F)) return NAN;
      return (float) id(hp_sniffer)->get_cmd(2, 0xA80F);

# Is a REAL gateway (0x0F) answering the heat pump? ON = a real gateway's acks/replies were
# heard in the last 15 s. The ESP's own replies are not counted, so this is OFF while the ESP
# is the gateway; ON while armed would mean two gateways (the ESP auto-disarms).
binary_sensor:
  - platform: template
    name: "Gateway 0x0F Replying"
    device_id: dev_shadow
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(hp_sniffer)->gateway_replying();

  # Any bit set in 2143..2147 (raw). Unknown until the alarm block has been seen.
  - platform: template
    name: "Heat Pump Alarm Bits Set"
    device_id: dev_alarms
    device_class: problem
    lambda: |-
      if (!id(hp_sniffer)->alarms_known()) return {};
      return id(hp_sniffer)->any_alarm_bit();

  # ==================================================================================
  # LIVE I/O (16 Oct 2026). Decoded from the heat pump's own ~1 s FC23 frames, not from
  # the gateway copy. dev2 command A80C (gateway 2013), A80F (2016), A811 (2018); dev4
  # reply ABEA (2030). With no fresh frame for 5 s these hold their last state -- check
  # "Live IO Fresh" (off = the values are stale).
  # ==================================================================================
  - platform: template
    name: "Live IO Fresh"
    device_id: dev_shadow
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(hp_sniffer)->has_cmd(2, 0xA80C);

  # --- Pump actually running = relay (A80C bit 5) on AND speed (A80F) above 10%.
  # --- With the system off the HP holds the relay on at 10%, and in test mode 10%
  # --- gave no flow, so the relay bit alone is not "running" (14:40 capture).
  - platform: template
    name: "Circulating Pump"
    device_id: dev_liveio
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_cmd(2, 0xA80C) || !id(hp_sniffer)->has_cmd(2, 0xA80F)) return {};
      bool relay = (id(hp_sniffer)->get_cmd(2, 0xA80C) & (1u << 5)) != 0;
      return relay && id(hp_sniffer)->get_cmd(2, 0xA80F) > 10;

  # --- A80C bit 5: the pump relay itself (matched in normal captures and test mode).
  - platform: template
    name: "Circulating Pump Relay"
    device_id: dev_liveio
    lambda: |-
      if (!id(hp_sniffer)->has_cmd(2, 0xA80C)) return {};
      return (id(hp_sniffer)->get_cmd(2, 0xA80C) & (1u << 5)) != 0;

  # --- dev4 ABEA bit 4 CLEAR = flow present (inverted). Tracks real flow: ~5 s behind
  # --- the pump each way, and dropped out at 5% speed with the relay still on.
  - platform: template
    name: "Flow Detected"
    device_id: dev_liveio
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_reply(4, 0xABEA)) return {};
      return (id(hp_sniffer)->get_reply(4, 0xABEA) & (1u << 4)) == 0;

  # --- A80C bit 0: change-over valve. Energised = hot water, de-energised = heating
  # --- (toggled twice in test mode; position from the user). Live, so ~5 s toggles show.
  - platform: template
    name: "Change-over Valve Hot Water"
    device_id: dev_liveio
    lambda: |-
      if (!id(hp_sniffer)->has_cmd(2, 0xA80C)) return {};
      return (id(hp_sniffer)->get_cmd(2, 0xA80C) & (1u << 0)) != 0;

  # --- A80C bit 6: set in every capture with the system on, clear with it off (one
  # --- capture, 14:40 16 Oct 2026). Possibly a system enable output. Unconfirmed.
  - platform: template
    name: "System Enable (A80C bit 6, unconfirmed)"
    device_id: dev_liveio
    lambda: |-
      if (!id(hp_sniffer)->has_cmd(2, 0xA80C)) return {};
      return (id(hp_sniffer)->get_cmd(2, 0xA80C) & (1u << 6)) != 0;

  # --- A811: 12 normally, 200 for the whole of test mode (one capture). Unconfirmed.
  - platform: template
    name: "Test Mode Active (unconfirmed)"
    device_id: dev_liveio
    lambda: |-
      if (!id(hp_sniffer)->has_cmd(2, 0xA811)) return {};
      return id(hp_sniffer)->get_cmd(2, 0xA811) == 200;

  # --- ODU status word 2095: bit mapping confirmed against reference decoding code ---
  - platform: template
    name: "ODU Unit On-Off"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2095)) return {};
      return (id(hp_sniffer)->get_register(2095) & (1u << 0)) != 0;
  - platform: template
    name: "ODU Defrost Active"
    device_id: dev_odu
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2095)) return {};
      return (id(hp_sniffer)->get_register(2095) & (1u << 2)) != 0;
  - platform: template
    name: "ODU Heating Mode"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2095)) return {};
      return (id(hp_sniffer)->get_register(2095) & (1u << 5)) != 0;
  - platform: template
    name: "ODU Hot Water Mode"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2095)) return {};
      return (id(hp_sniffer)->get_register(2095) & (1u << 6)) != 0;
  - platform: template
    name: "ODU Cooling Mode"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2095)) return {};
      return (id(hp_sniffer)->get_register(2095) & (1u << 7)) != 0;
  - platform: template
    name: "ODU Thermal On-Off"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2095)) return {};
      return (id(hp_sniffer)->get_register(2095) & (1u << 9)) != 0;
  - platform: template
    name: "ODU Compressor Down"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2095)) return {};
      return (id(hp_sniffer)->get_register(2095) & (1u << 10)) != 0;

  # --- ODU status word 2094: bit mapping confirmed against reference decoding code ---
  - platform: template
    name: "ODU Compressor Status"
    device_id: dev_odu
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2094)) return {};
      return (id(hp_sniffer)->get_register(2094) & (1u << 0)) != 0;
  - platform: template
    name: "ODU Fourway Valve Status"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2094)) return {};
      return (id(hp_sniffer)->get_register(2094) & (1u << 1)) != 0;
  - platform: template
    name: "ODU Fan Status"
    device_id: dev_odu
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2094)) return {};
      return (id(hp_sniffer)->get_register(2094) & (1u << 2)) != 0;
  - platform: template
    name: "ODU Flow Detected"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2094)) return {};
      return (id(hp_sniffer)->get_register(2094) & (1u << 3)) != 0;
  - platform: template
    name: "ODU Refrigerant Used"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2094)) return {};
      return (id(hp_sniffer)->get_register(2094) & (1u << 4)) != 0;
  - platform: template
    name: "ODU Split"
    device_id: dev_odu
    lambda: |-
      if (!id(hp_sniffer)->has_register(2094)) return {};
      return (id(hp_sniffer)->get_register(2094) & (1u << 5)) != 0;

  # --- 2149 Operational Status Register, bits 0-7 (2149.0 .. 2149.7) ---
  - platform: template
    name: "Building Space Heating"
    device_id: dev_opmode
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      return (id(hp_sniffer)->get_register(2149) & (1u << 0)) != 0;
  - platform: template
    name: "Domestic Hot Water Production"
    device_id: dev_opmode
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      return (id(hp_sniffer)->get_register(2149) & (1u << 1)) != 0;
  - platform: template
    name: "Hot Water Top-Up or Antilegionella"
    device_id: dev_opmode
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      return (id(hp_sniffer)->get_register(2149) & (1u << 2)) != 0;
  - platform: template
    name: "Pool Heating"
    device_id: dev_opmode
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      return (id(hp_sniffer)->get_register(2149) & (1u << 3)) != 0;
  - platform: template
    name: "Building Defrost"
    device_id: dev_opmode
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      return (id(hp_sniffer)->get_register(2149) & (1u << 4)) != 0;
  - platform: template
    name: "Hot Water Defrost"
    device_id: dev_opmode
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      return (id(hp_sniffer)->get_register(2149) & (1u << 5)) != 0;
  - platform: template
    name: "Outdoor Low Temp Stop"
    device_id: dev_opmode
    device_class: problem
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      return (id(hp_sniffer)->get_register(2149) & (1u << 6)) != 0;
  - platform: template
    name: "Cooling Mode"
    device_id: dev_opmode
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      return (id(hp_sniffer)->get_register(2149) & (1u << 7)) != 0;
  # Bit 9 came from an earlier supplied list, not the current 2149 definition (bits
  # 0-7). Kept so nothing is lost; delete this block if it never turns on.
  - platform: template
    name: "Operation Status: Concrete Drying (unconfirmed)"
    device_id: dev_opmode
    device_class: running
    lambda: |-
      if (!id(hp_sniffer)->has_register(2149)) return {};
      return (id(hp_sniffer)->get_register(2149) & (1u << 9)) != 0;

  # --- Queued demands word 2150: names supplied directly, NOT code-confirmed. Bits
  # --- 3 and 5 are deliberately absent (not in the supplied list).
  - platform: template
    name: "Queued Demand: Heating (unconfirmed)"
    device_id: dev_opmode
    lambda: |-
      if (!id(hp_sniffer)->has_register(2150)) return {};
      return (id(hp_sniffer)->get_register(2150) & (1u << 0)) != 0;
  - platform: template
    name: "Queued Demand: Hot Water (unconfirmed)"
    device_id: dev_opmode
    lambda: |-
      if (!id(hp_sniffer)->has_register(2150)) return {};
      return (id(hp_sniffer)->get_register(2150) & (1u << 1)) != 0;
  - platform: template
    name: "Queued Demand: Pool (unconfirmed)"
    device_id: dev_opmode
    lambda: |-
      if (!id(hp_sniffer)->has_register(2150)) return {};
      return (id(hp_sniffer)->get_register(2150) & (1u << 2)) != 0;
  - platform: template
    name: "Queued Demand: Cooling (unconfirmed)"
    device_id: dev_opmode
    lambda: |-
      if (!id(hp_sniffer)->has_register(2150)) return {};
      return (id(hp_sniffer)->get_register(2150) & (1u << 4)) != 0;
  - platform: template
    name: "Queued Demand: Concrete Drying (unconfirmed)"
    device_id: dev_opmode
    lambda: |-
      if (!id(hp_sniffer)->has_register(2150)) return {};
      return (id(hp_sniffer)->get_register(2150) & (1u << 6)) != 0;
